<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200">
  <defs>
    <!-- Background radial glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0d2040"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Left arm gradient (purple → blue) -->
    <linearGradient id="leftGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6B3FD4"/>
      <stop offset="100%" stop-color="#2B6FE0"/>
    </linearGradient>
    <!-- Right arm gradient (blue → purple) -->
    <linearGradient id="rightGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2B6FE0"/>
      <stop offset="100%" stop-color="#6B3FD4"/>
    </linearGradient>
    <!-- Centre glow -->
    <radialGradient id="centreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#7ac8ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2B6FE0" stop-opacity="0"/>
    </radialGradient>
    <!-- Ray burst -->
    <radialGradient id="rayGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fa8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000510" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Black background -->
  <rect width="200" height="200" fill="#000000"/>

  <!-- Background radial glow -->
  <ellipse cx="100" cy="100" rx="90" ry="90" fill="url(#bgGlow)"/>

  <!-- Ray burst behind the X -->
  <ellipse cx="100" cy="100" rx="70" ry="70" fill="url(#rayGlow)"/>

  <!-- X mark: top-left arm -->
  <polygon points="24,16 100,100 70,100 16,24" fill="url(#leftGrad)" opacity="0.95"/>
  <!-- X mark: top-right arm -->
  <polygon points="176,16 130,100 100,100 184,24" fill="url(#rightGrad)" opacity="0.95"/>
  <!-- X mark: bottom-left arm -->
  <polygon points="16,176 100,100 70,100 24,184" fill="url(#leftGrad)" opacity="0.95"/>
  <!-- X mark: bottom-right arm -->
  <polygon points="184,176 130,100 100,100 176,184" fill="url(#rightGrad)" opacity="0.95"/>

  <!-- Inner light rays (thin bright lines through centre) -->
  <line x1="100" y1="10" x2="100" y2="190" stroke="#5ab8ff" stroke-width="1.5" opacity="0.25"/>
  <line x1="10" y1="100" x2="190" y2="100" stroke="#5ab8ff" stroke-width="1.5" opacity="0.25"/>

  <!-- Centre glow circle -->
  <circle cx="100" cy="100" r="28" fill="url(#centreGlow)" opacity="0.9"/>
  <!-- Bright centre dot -->
  <circle cx="100" cy="100" r="5" fill="#ffffff" opacity="1"/>
  <circle cx="100" cy="100" r="2.5" fill="#ffffff" opacity="1"/>
</svg>
